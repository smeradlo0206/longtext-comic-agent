name: Feature
description: Feature request or implementation slice
body:
  - type: textarea
    id: background
    attributes: {label: Background}
    validations: {required: true}
  - type: textarea
    id: goal
    attributes: {label: Goal}
    validations: {required: true}
  - type: textarea
    id: input
    attributes: {label: Input}
  - type: textarea
    id: output
    attributes: {label: Output}
  - type: textarea
    id: not-doing
    attributes: {label: Not Doing}
  - type: textarea
    id: dependencies
    attributes: {label: Dependencies}
  - type: textarea
    id: acceptance
    attributes: {label: Acceptance}
    validations: {required: true}
  - type: textarea
    id: tests
    attributes: {label: Tests}
    validations: {required: true}
  - type: input
    id: owner
    attributes: {label: Recommended Owner}
