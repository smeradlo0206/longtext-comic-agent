[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "longtext-comic-agent"
dynamic = ["version"]
description = "Source-grounded long-text comic production with a local FLUX.2 backend."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "accelerate>=1.7,<2",
  "alembic>=1.13",
  "diffusers>=0.37,<0.38",
  "fastapi>=0.115",
  "httpx>=0.27",
  "huggingface-hub>=0.30,<2",
  "numpy>=1.26,<3",
  "Pillow>=11,<13",
  "psycopg[binary]>=3.2",
  "pydantic>=2.8,<3",
  "pydantic-settings>=2.4",
  "python-multipart>=0.0.9",
  "safetensors>=0.5,<1",
  "sqlalchemy>=2.0",
  "torch==2.7.1",
  "transformers>=4.51,<5",
  "uvicorn[standard]>=0.30",
]

[project.optional-dependencies]
dev = ["mypy>=1.11", "pytest>=8,<10", "ruff>=0.6"]

[project.scripts]
comic-agent = "comic_agent.cli:main"
flux2-agent = "flux2_agent.cli:main"

[tool.setuptools.packages.find]
where = [".", "src"]
include = ["comic_agent*", "flux2_agent*"]

[tool.setuptools.package-data]
flux2_agent = ["py.typed"]

[tool.setuptools.dynamic]
version = {attr = "comic_agent.__version__"}

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]
mypy_path = "src"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = [".", "src"]
