<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="theme-color" content="#f7f4ee">
  <title>页面未找到 · 绘卷</title>
  <style>
    :root { --paper:#f7f4ee; --ink:#201e1a; --muted:#777168; --red:#d9513c; }
    * { box-sizing:border-box; }
    body { margin:0; background:var(--paper); color:var(--ink);
      font:15px/1.6 Inter,system-ui,"Microsoft YaHei",sans-serif;
      min-height:100vh; display:grid; place-items:center; padding:24px; text-align:center; }
    .card { max-width:460px; padding:48px 40px; }
    .mark { font:700 4.5rem/1 serif; color:var(--red); }
    h1 { font:700 2rem/1.2 "Noto Serif SC",serif; margin:8px 0 12px; }
    p { color:var(--muted); margin:0 0 28px; }
    a { display:inline-block; padding:13px 26px; border-radius:99px;
      background:var(--red); color:#fff; font-weight:800; text-decoration:none; }
    a:hover { filter:brightness(.94); }
  </style>
</head>
<body>
  <div class="card">
    <div class="mark">404</div>
    <h1>页面未找到</h1>
    <p>这个地址不存在，或作品链接已失效。</p>
    <a href="./">返回首页</a>
  </div>
</body>
</html>
